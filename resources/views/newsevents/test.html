<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Table with Search and Date Range Filter</title>
<style>
    /* Basic styling for the table */
    table {
        border-collapse: collapse;
        width: 100%;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    /* Style for search input */
    #searchInput {
        width: 50%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    /* Style for date input */
    .dateFilter {
        width: 40%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    /* Style for filter button */
    #filterBtn {
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
</style>
</head>
<body>

<input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search for names or emails..">
From: <input type="date" id="startDateInput" class="dateFilter" placeholder="Start Date">
To: <input type="date" id="endDateInput" class="dateFilter" placeholder="End Date">
<button id="filterBtn" onclick="filterTable()">Filter</button>

<table id="dataTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>John Doe</td>
            <td>30</td>
            <td>john@example.com</td>
            <td>2024-04-01</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>25</td>
            <td>jane@example.com</td>
            <td>2024-04-03</td>
        </tr>
        <tr>
            <td>Michael Johnson</td>
            <td>35</td>
            <td>michael@example.com</td>
            <td>2024-04-05</td>
        </tr>
        <!-- Add more rows as needed -->
    </tbody>
</table>

<script>
function searchTable() {
    // Declare variables
    var input, filter, table, tr, td, i, txtValue;
    input = document.getElementById("searchInput");
    filter = input.value.toUpperCase();
    table = document.getElementById("dataTable");
    tr = table.getElementsByTagName("tr");

    // Loop through all table rows, and hide those that don't match the search query
    for (i = 0; i < tr.length; i++) {
        td = tr[i].getElementsByTagName("td");
        for (var j = 0; j < td.length; j++) {
            if (td[j]) {
                txtValue = td[j].textContent || td[j].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                    break;
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }
}

function filterTable() {
    // Declare variables
    var startDateInput, endDateInput, startDate, endDate, table, tr, td, i, dateValue;
    startDateInput = document.getElementById("startDateInput");
    endDateInput = document.getElementById("endDateInput");
    startDate = startDateInput.value;
    endDate = endDateInput.value;
    table = document.getElementById("dataTable");
    tr = table.getElementsByTagName("tr");

    // Loop through all table rows, and hide those that fall outside the selected date range
    for (i = 0; i < tr.length; i++) {
        td = tr[i].getElementsByTagName("td");
        dateValue = td[3].textContent || td[3].innerText; // Date is in the fourth column (index 3)
        if ((startDate === "" || dateValue >= startDate) && (endDate === "" || dateValue <= endDate)) {
            tr[i].style.display = "";
        } else {
            tr[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
